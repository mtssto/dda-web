<!DOCTYPE html>

<html lang="es">

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Diego de Aduriz | Obras</title>
    <!-- Estilos CSS -->
    <link href="obras.css" rel="stylesheet" />
    <link href="../../navbar.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../global-close.css">
</head>

<body>

    <div class="close-container">
        <a href="../../index.html" class="close-btn">CLOSE</a>
    </div>

    <main class="container">
        <!-- SECTION 1: PASTELES -->
        <section id="pasteles">
            <h1 class="section-title">Pasteles</h1>
            <div class="masonry-grid">
            </div>
        </section>
        <section id="gatos">
            <h1 class="section-title">Gatos</h1>
            <div class="masonry-grid">
            </div>
        </section>
        <section id="paisajes">
            <h1 class="section-title">Paisajes</h1>
            <div class="masonry-grid">
            </div>
        </section>
        <section id="Autorretratos">
            <h1 class="section-title">Autorretratos</h1>
            <div class="masonry-grid">
            </div>
        </section>
        <!-- SECTION 2: DIGITAL ART -->
        <section id="digital">
            <h1 class="section-title">Digital Art</h1>
            <div class="masonry-grid">
            </div>
        </section>
        <!-- SECTION 3: ILUSTRACIONES -->
        <section id="ilustraciones">
            <h1 class="section-title">Ilustraciones</h1>
            <div class="masonry-grid">
            </div>
        </section>

        <!-- SECTION 4: VIDEOS -->
        <section id="videos">
            <h1 class="section-title">Videos</h1>
            <div class="video-grid">
                <!-- Using paths found in user's directory in 2-column grid -->
                <div class="video-item"><video controls="">
                        <source src="videos/ddavideo1.mp4" type="video/mp4" />
                    </video></div>
                <div class="video-item"><video controls="">
                        <source src="videos/dda3.mp4" type="video/mp4" />
                    </video></div>
                <div class="video-item"><video controls="">
                        <source src="videos/dda4.mp4" type="video/mp4" />
                    </video></div>
                <div class="video-item"><video controls="">
                        <source src="videos/dda5.mp4" type="video/mp4" />
                    </video></div>
                <div class="video-item"><video controls="">
                        <source src="videos/dda6.mp4" type="video/mp4" />
                    </video></div>
                <div class="video-item"><video controls="">
                        <source src="videos/dda7.mp4" type="video/mp4" />
                    </video></div>
                <div class="video-item"><video controls="">
                        <source src="videos/dda8.mp4" type="video/mp4" />
                    </video></div>
                <div class="video-item"><video controls="">
                        <source src="videos/dda9.mp4" type="video/mp4" />
                    </video></div>
            </div>
        </section>
        <!-- Modal for Image View -->
        <div class="image-modal" id="imageModal">
            <span class="modal-close">×</span>
            <div class="modal-container">
                <div class="modal-image-wrapper">
                    <span class="modal-prev" id="modalPrev">&#10094;</span>
                    <span class="modal-next" id="modalNext">&#10095;</span>
                    <img alt="Artwork" class="modal-image" id="modalImage" />
                </div>
                <div class="modal-info-wrapper">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <p class="modal-technique" id="modalTechnique"></p>
                    <p class="modal-dimensions" id="modalDimensions"></p>
                    <p class="modal-year" id="modalYear" style="color: #666; font-size: 0.9rem; margin-top: 5px;"></p>
                    <div class="modal-actions">
                        <a class="modal-buy-btn btn-modal-buy" data-i18n="modal.consult" href="#" id="modalBuyBtn"
                            target="_blank">CONSULTAR / COMPRAR</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal for pure Image Zoom -->
        <div id="lightBoxModal" class="lightbox-modal">
            <span class="lightbox-close">&times;</span>
            <span class="lightbox-prev" id="lightBoxPrev">&#10094;</span>
            <span class="lightbox-next" id="lightBoxNext">&#10095;</span>
            <img class="lightbox-image" id="lightBoxImage" alt="Artwork Zoom">
        </div>
    </main>
    <footer>
        <p>© 2024 Diego de Aduriz. All rights reserved.</p>
    </footer>
    <!-- Materialize for Materialboxed images -->
    <script src="../../i18n.js"></script>
    <script src="../../shop/products.js"></script>
    <script src="obras.js"></script>
</body>

</html>
