<body class="journal-page">

    <div class="close-container">
        <a href="../index.html" class="close-btn">CLOSE</a>
    </div>

    <div class="diary-layout">
        <div class="diary-top-bar">
            <h1 class="diary-top-bar__title" data-i18n="journal.title">Blog</h1>
            <label class="diary-search">
                <span class="visually-hidden">Buscar</span>
                <input type="search" id="forumSearch" placeholder="Buscar…" autocomplete="off">
            </label>
        </div>

        <div class="diary-book" id="diaryBook">
            <div class="diary-book__viewport" id="bookViewport"></div>
            <div class="diary-book__nav" id="bookNav" hidden>
                <button type="button" class="diary-nav-btn" id="btnPrev" aria-label="Página anterior">&#8592;</button>
                <span class="diary-nav-info" id="pageInfo"></span>
                <button type="button" class="diary-nav-btn" id="btnNext" aria-label="Página siguiente">&#8594;</button>
            </div>
        </div>

        <p class="diary-empty" id="journalEmpty" hidden data-i18n="journal.empty">Aún no hay entradas publicadas.</p>

        <section class="diary-newsletter" aria-labelledby="newsletter-title">
            <h3 id="newsletter-title" data-i18n="journal.newsletter_title">Boletín del estudio</h3>
            <p data-i18n="journal.newsletter_desc">Arte, proceso y notas del taller. Sin spam.</p>
            <form class="journal-newsletter-form" id="journalNewsletterForm">
                <input type="email" name="email" required placeholder="tu@email.com" autocomplete="email" aria-label="Email">
                <button type="submit" data-i18n="journal.newsletter_btn">Suscribirme</button>
            </form>
            <p class="newsletter-msg" hidden role="status"></p>
        </section>
    </div>

    <footer class="journal-footer">
        &copy; 2026 Diego De Aduriz. <span data-i18n="footer.rights">Todos los derechos reservados.</span>
    </footer>

    <script src="../i18n/journal-translations.js"></script>
    <script src="../i18n.js" defer></script>
    <script src="../shop/config.js"></script>
    <script src="../shop/analytics.js"></script>
    <script src="../shop/newsletter.js" defer></script>
    <script src="journal-api.js" defer></script>
    <script src="journal-app.js" defer></script>
    <script src="index.js" defer></script>
    <script src="../shop/newsletter-popup.js" defer></script>
</body>

</html>
