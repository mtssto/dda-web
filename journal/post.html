<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego De Aduriz | Cuaderno</title>
    <meta name="description" content="Entrada del cuaderno del artista Diego De Aduriz.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://diegodeaduriz.art/journal/post.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../global-close.css">
    <link rel="stylesheet" href="journal.css">
</head>

<body class="journal-page">

    <div class="close-container">
        <a href="../index.html" class="close-btn">CLOSE</a>
    </div>

    <main class="diary-post-layout">
        <nav class="diary-breadcrumb">
            <a href="index.html" data-i18n="journal.all">&larr; Todas las entradas</a>
        </nav>

        <div class="diary-post-card-wrap">
            <article class="diary-post-card" id="journalArticle">
                <div class="diary-post-inner">
                    <span class="diary-post__date" id="postMeta"></span>
                    <p class="diary-post__author" id="postAuthor">Diego De Aduriz</p>
                    <h1 class="diary-post__title" id="postTitle"></h1>
                    <div class="diary-post__tags" id="postTags"></div>
                    <img class="diary-post__cover" id="postCover" alt="" loading="eager" decoding="async">
                    <div class="diary-post__content" id="postContent"></div>

                    <div class="diary-actions">
                        <button type="button" class="diary-action-btn" id="btnLike" aria-pressed="false">
                            <span aria-hidden="true">&#9829;</span> <span data-i18n="journal.like">Me gusta</span> <span id="likeCount"></span>
                        </button>
                        <button type="button" class="diary-action-btn" id="btnSave" aria-pressed="false">
                            <span aria-hidden="true">&#9671;</span> <span id="saveLabel" data-i18n="journal.save">Guardar</span>
                        </button>
                    </div>
                </div>
            </article>
        </div>

        <section class="diary-replies" aria-labelledby="comments-heading">
            <h2 id="comments-heading" data-i18n="journal.replies">Respuestas</h2>
            <form class="diary-reply-form" id="commentForm">
                <textarea id="commentText" rows="4" data-i18n-placeholder="journal.comment_placeholder" placeholder="Compartí tu reflexión…" required></textarea>
                <p class="diary-comment-hint" id="commentHint" hidden role="status"></p>
                <button type="submit" data-i18n="journal.comment_submit">Publicar comentario</button>
            </form>
            <ul class="diary-comment-list" id="commentList"></ul>
        </section>
    </main>

    <footer class="journal-footer">
        <a href="index.html" class="journal-footer__link" data-i18n="journal.all">Todas las entradas</a>
    </footer>

    <script src="../i18n/journal-translations.js"></script>
    <script src="../i18n.js" defer></script>
    <script src="../shop/config.js"></script>
    <script src="../shop/analytics.js"></script>
    <script src="../shop/auth.js" defer></script>
    <script src="journal-api.js" defer></script>
    <script src="journal-app.js" defer></script>
    <script src="post.js" defer></script>
</body>

</html>
