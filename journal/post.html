<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego De Aduriz | Cuaderno</title>
    <meta name="description" content="Entrada del cuaderno del artista Diego De Aduriz.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://diegodeaduriz.art/journal/post.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../global-close.css">
    <link rel="stylesheet" href="journal.css">
</head>

<body class="journal-page forum-page">

    <div class="close-container">
        <a href="../index.html" class="close-btn">CLOSE</a>
    </div>

    <main class="forum-thread-page">
        <nav class="forum-breadcrumb">
            <a href="index.html" data-i18n="journal.all">← Todas las entradas</a>
        </nav>

        <article class="forum-post journal-article" id="journalArticle">
            <header class="forum-post__header">
                <div class="forum-post__avatar" id="postAuthorAvatar" aria-hidden="true">DDA</div>
                <div class="forum-post__meta-wrap">
                    <p class="forum-post__author" id="postAuthor">Diego De Aduriz</p>
                    <p class="forum-post__meta" id="postMeta"></p>
                    <div class="journal-card__tags forum-post__tags" id="postTags"></div>
                </div>
            </header>

            <h1 class="forum-post__title" id="postTitle"></h1>
            <img class="journal-article__cover forum-post__cover" id="postCover" alt="" loading="eager" decoding="async">
            <div class="journal-article__content forum-post__body" id="postContent"></div>

            <div class="journal-actions forum-post__actions">
                <button type="button" class="journal-action-btn" id="btnLike" aria-pressed="false">
                    <span aria-hidden="true">♥</span> <span data-i18n="journal.like">Me gusta</span> <span id="likeCount"></span>
                </button>
                <button type="button" class="journal-action-btn" id="btnSave" aria-pressed="false">
                    <span aria-hidden="true">◇</span> <span id="saveLabel" data-i18n="journal.save">Guardar</span>
                </button>
            </div>
        </article>

        <section class="journal-comments forum-replies" aria-labelledby="comments-heading">
            <h2 id="comments-heading" data-i18n="journal.replies">Respuestas</h2>
            <form class="journal-comment-form forum-reply-form" id="commentForm">
                <textarea id="commentText" rows="4" data-i18n-placeholder="journal.comment_placeholder" placeholder="Compartí tu reflexión…" required></textarea>
                <p class="journal-card__meta obra-comment-hint" id="commentHint" hidden role="status"></p>
                <button type="submit" data-i18n="journal.comment_submit">Publicar comentario</button>
            </form>
            <ul class="journal-comment-list forum-reply-list" id="commentList"></ul>
        </section>
    </main>

    <footer class="journal-footer">
        <a href="index.html" class="journal-footer__link" data-i18n="journal.all">Todas las entradas</a>
    </footer>

    <script src="../i18n/journal-translations.js"></script>
    <script src="../i18n.js" defer></script>
    <script src="../shop/config.js"></script>
    <script src="../shop/auth.js" defer></script>
    <script src="journal-api.js" defer></script>
    <script src="journal-app.js" defer></script>
    <script src="post.js" defer></script>
</body>

</html>
