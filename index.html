  <script>
    // Minimal script to handle shop popup if immersive-gallery isn't imported
    document.addEventListener('DOMContentLoaded', () => {
      const welcomeShopModal = document.getElementById('welcomeShopModal');
      const welcomeClose = document.getElementById('welcomeClose');

      // Show after a delay
      if (welcomeShopModal) {
        welcomeShopModal.style.display = 'block';
      }

      if (welcomeClose) {
        welcomeClose.addEventListener('click', () => {
          if (welcomeShopModal) welcomeShopModal.style.display = 'none';
        });
      }
    });

  </script>
