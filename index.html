  <!-- Welcome Shop Popup (Small Toast) -->
  <div id="welcomeShopModal"
    style="display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 350px; z-index: 2000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); padding: 25px 35px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.05); text-align: center; box-sizing: border-box;">
    <span class="modal-close" id="welcomeClose"
      style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #666; line-height: 1;">&times;</span>
    <p data-i18n="index.welcome_shop"
      style="font-family: 'Playfair Display', serif; font-size: 1.15rem; color: #333; margin-bottom: 20px; line-height: 1.4; margin-top: 10px;">
      Descubre obras originales exclusivas.
    </p>
    <a href="./shop/shop.html" class="modal-buy-btn" data-i18n="index.go_to_shop"
      style="text-decoration: none; display: inline-block; width: 100%; border-radius: 4px; padding: 12px 20px; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.1em; background: #000; color: #fff;">IR
      AL SHOP</a>
    <button id="welcomeExploreBtn" style="display: none;"></button>
  </div>

  <!-- Note: We are not importing navbar.js here so we can keep the index pristine. -->
  <script src="i18n.js"></script>
  <script src="collage-bg.js"></script>
  <script>
    // Minimal script to handle shop popup if immersive-gallery isn't imported
    document.addEventListener('DOMContentLoaded', () => {
      const welcomeShopModal = document.getElementById('welcomeShopModal');
      const welcomeClose = document.getElementById('welcomeClose');

      // Show after a delay
      if (welcomeShopModal) {
        welcomeShopModal.style.display = 'block';
      }

      if (welcomeClose) {
        welcomeClose.addEventListener('click', () => {
          if (welcomeShopModal) welcomeShopModal.style.display = 'none';
        });
      }
    });

  </script>
