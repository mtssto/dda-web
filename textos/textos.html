<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icon-192x192.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego de Aduriz | Publicaciones</title>
    <link rel="canonical" href="https://diegodeaduriz.art/textos/textos.html" />

    <!-- Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="book.css">
    <link rel="stylesheet" href="../global-close.css">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <!-- PageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>

<body class="minimal-textos">

    <!-- Book Container -->
    <!-- Catalog View -->
    <div id="catalog-view" class="catalog-view">
        <div class="close-container">
            <a href="../index.html" class="close-btn" data-i18n="close">CLOSE</a>
        </div>

        <h1 class="catalog-title">Publicaciones</h1>
        <div id="catalog-grid" class="catalog-grid">
            <!-- Book items will be injected here JS -->
        </div>
    </div>

    <!-- Reader View (Hidden by default) -->
    <div id="reader-view" style="display: none;">
        <button id="backToCatalogBtn" class="back-btn">← Volver al Catálogo</button>

        <div id="loading">Loading Book...</div>

        <div class="book-container">
            <!-- The Flipbook Element -->
            <div id="flipbook">
                <!-- Pages will be injected here by JS -->
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn-control" id="prevBtn" title="Previous Page">←</button>
            <span id="pageInfo" style="font-size: 0.9rem; margin-top: 3px;"></span>
            <button class="btn-control" id="nextBtn" title="Next Page">→</button>
        </div>
    </div>

    <script src="../i18n.js"></script>
    <script src="book.js"></script>
</body>

</html>
