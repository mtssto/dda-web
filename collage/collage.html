<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="../icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego de Aduriz | Collage Creator</title>
    <link rel="stylesheet" href="../index copy.css">
    <link rel="stylesheet" href="collage.css">
    <!-- Touch punch for mobile drag support if using JQuery UI, but we will write vanilla JS -->
    <link rel="stylesheet" href="../global-close.css">
</head>

<body>

    <div class="close-container">
        <a href="../index.html" class="close-btn">CLOSE</a>
    </div>

    <!-- Global Navbar -->
    <main class="collage-container">
        <div class="collage-header">
            <h1>Create Your Own Composition</h1>
            <p>Drag images onto the canvas. Move, resize, and rotate to create something new!</p>
            <div class="collage-actions">
                <button id="clear-btn" class="btn-secondary">Clear Canvas</button>
                <button id="download-btn" class="btn-primary">Download Image</button>
            </div>
        </div>

        <div class="workspace">
            <!-- Sidebar / Palette -->
            <div class="palette-container">
                <h3>Stickers</h3>
                <div class="palette" id="palette">
                    <!-- Images to drag directly -->
                    <img src="../Ilustrates/collage_new_chars.jpg" draggable="true" class="sticker-source">
                    <img src="../Ilustrates/dibu1.jpg" draggable="true" class="sticker-source">
                    <img src="../Ilustrates/b.jpg" draggable="true" class="sticker-source">
                    <img src="../Ilustrates/cc.jpg" draggable="true" class="sticker-source">
                    <img src="../Ilustrates/dibu5.jpg" draggable="true" class="sticker-source">
                    <img src="../Ilustrates/bb.jpg" draggable="true" class="sticker-source">
                    <img src="../Ilustrates/aaaa.jpg" draggable="true" class="sticker-source">
                    <img src="../Ilustrates/dibu3.jpg" draggable="true" class="sticker-source">
                    <img src="../Ilustrates/ccc.jpg" draggable="true" class="sticker-source">
                </div>
            </div>

            <!-- Main Canvas Area -->
            <div class="canvas-wrapper">
                <div id="collage-canvas">
                    <p class="placeholder-text">Drop items here</p>
                </div>
            </div>
        </div>

        <!-- Controls for selected item -->
        <div id="item-controls" class="hidden">
            <button id="btn-delete" title="Delete">🗑️</button>
            <button id="btn-front" title="Bring to Front">⬆️</button>
            <button id="btn-back" title="Send to Back">⬇️</button>
            <input type="range" id="scale-slider" min="0.5" max="3" step="0.1" value="1" title="Scale">
            <input type="range" id="rotate-slider" min="0" max="360" step="5" value="0" title="Rotate">
        </div>

    </main>

    <!-- html2canvas for downloading -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="collage.js"></script>
</body>

</html>
