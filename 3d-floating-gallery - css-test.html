<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego de Aduriz | 3D Floating Gallery</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            /* Hide standard scrollbars */
            background-color: #dbe2e8;
            /* Soft blue-grey from your reference */
            font-family: 'Inter', sans-serif;
            color: #111;
        }

        /* Essential UI overlays */
        .overlay {
            position: absolute;
            z-index: 100;
            padding: 20px;
        }

        .header {
            top: 0;
            left: 0;
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-style: italic;
        }

        .instructions {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: #555;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            text-decoration: none;
            color: #111;
            letter-spacing: 2px;
        }

        /* The 3D World container */
        #world {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            perspective: 1200px;
            /* Depth of the camera */
            pointer-events: none;
            /* Let clicks pass to scene */
        }

        /* The camera that will move through the Z axis */
        #camera {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            /* No transition here because we do it in JS for smoothness */
        }

        /* Individual floating images */
        .floating-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            pointer-events: auto;
            /* Allow hovering/clicking */
            cursor: pointer;
            transition: filter 0.3s, box-shadow 0.3s;
            background: #fff;
            padding: 10px;
            padding-bottom: 40px;
            /* Polaroid style */
        }

        .floating-img:hover {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        .floating-img img {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 400px;
        }
    </style>
</head>

<body>

    <div class="overlay header">Floating Universe</div>
    <a href="index.html" class="overlay close-btn">CLOSE</a>
    <div class="overlay instructions">Scroll to fly through space &bull; Move mouse to look around</div>

    <div id="world">
        <div id="camera">
            <!-- JS will inject floating images here -->
        </div>
    </div>

    <script>
        const camera = document.getElementById('camera');

        // Physics variables for smooth camera movement
        let currentZ = 0;
        let targetZ = 0;
        let mouseX = 0;
        let mouseY = 0;
        let currentX = 0;
        let currentY = 0;

        // Constants for our 3D space
        const spaceDepth = 8000; // How far deep the images go
        const spreadX = 3000;    // Horizontal spread
        const spreadY = 2000;    // Vertical spread

        // 1. Fetch images dynamically and generate the gallery
        fetch('3d-images.json')
            .then(response => response.json())
            .then(images => {
                // Shuffle array to ensure randomness on every page load
                images.sort(() => Math.random() - 0.5);

                // Limit to 100 images to prevent browser lag, but they are all unique
                const imageCount = Math.min(100, images.length);

                for (let i = 0; i < imageCount; i++) {
                    const el = document.createElement('div');
                    el.className = 'floating-img';

                    // Random coordinates in 3D space
                    // X and Y are spread around the center.
                    const rx = (Math.random() - 0.5) * spreadX;
                    const ry = (Math.random() - 0.5) * spreadY;
                    // Z goes deep into the screen (negative values in CSS 3D space)
                    const rz = -(Math.random() * spaceDepth);

                    // Random scales and slight rotations to make it dynamic
                    const scale = 0.5 + (Math.random() * 0.8);
                    const rotateZ = (Math.random() - 0.5) * 15; // slight tilt

                    // Apply starting position
                    el.style.transform = `translate3d(${rx}px, ${ry}px, ${rz}px) scale(${scale}) rotateZ(${rotateZ}deg)`;

                    // Append unique image
                    const img = document.createElement('img');
                    img.src = images[i];
                    el.appendChild(img);

                    camera.appendChild(el);
                }
            })
            .catch(error => console.error("Error loading images:", error));

        // 2. Track scrolling to move the camera forward/backward
        window.addEventListener('wheel', (e) => {
            // Adjust scroll speed multiplier as desired
            targetZ += e.deltaY * 3;

            // Constrain camera so user can't fly backwards out of the universe,
            // nor fly infinitely past the last image.
            targetZ = Math.max(0, Math.min(targetZ, spaceDepth + 1000));
        });

        // 3. Track mouse movement to pan "head" around
        window.addEventListener('mousemove', (e) => {
            // Normalize mouse position from -0.5 to 0.5
            mouseX = (e.clientX / window.innerWidth) - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        // 4. Animation loop for buttery smooth physics
        function updateCamera() {
            // Easing (Lerp) for super smooth gliding
            currentZ += (targetZ - currentZ) * 0.05;

            // How much the camera pans based on mouse
            const panStrength = 1500;
            const targetX = mouseX * panStrength;
            const targetY = mouseY * panStrength;

            currentX += (targetX - currentX) * 0.05;
            currentY += (targetY - currentY) * 0.05;

            // Apply to the camera container.
            // Moving the container forward (positive Z) brings the negative-Z items closer!
            camera.style.transform = `translate3d(${-currentX}px, ${-currentY}px, ${currentZ}px)`;

            // Keep looping
            requestAnimationFrame(updateCamera);
        }

        // Start animation
        updateCamera();

    </script>
</body>

</html>
