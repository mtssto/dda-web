spring:
  application:
    name: dda-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cache:
    type: caffeine
    cache-names: artworks,artworkBySlug,categories,users
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:dda-art-shop-default-secret-key-change-in-production-min-256-bits-long}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
    allowed-types: image/jpeg,image/png,image/webp,image/gif
  static:
    base-url: ${STATIC_BASE_URL:https://diegodeaduriz.art}
  public-base-url: ${PUBLIC_BASE_URL:https://dda-web-production.up.railway.app}
  admin:
    seed-enabled: ${DDA_ADMIN_SEED_ENABLED:false}
    username: ${DDA_ADMIN_USERNAME:admin}
    email: ${DDA_ADMIN_EMAIL:admin@diegodeaduriz.art}
    password: ${DDA_ADMIN_PASSWORD:}
    promote-existing: true

dda:
  # One-time recovery on Railway: set DDA_FLYWAY_REPAIR=true, deploy once, then remove it.
  flyway:
    repair: ${DDA_FLYWAY_REPAIR:false}
  mail:
    enabled: ${DDA_MAIL_ENABLED:false}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${DDA_MAIL_FROM:DDA <onboarding@resend.dev>}
    comment-notify-to: ${DDA_COMMENT_NOTIFY_EMAIL:admin@diegodeaduriz.art}

# Base values for local/dev so CloudinaryConfig can start.
# For real uploads, set these environment variables locally.
# In prod, the prod profile below requires the real env vars.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:ddadb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    locations: classpath:db/migration

app:
  admin:
    seed-enabled: true
    username: admin
    email: admin@localhost
    password: admin123

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
