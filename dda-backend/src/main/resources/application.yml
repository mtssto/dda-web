spring:
  application:
    name: dda-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cache:
    type: caffeine
    cache-names: artworks,artworkBySlug,categories,users
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:dda-art-shop-default-secret-key-change-in-production-min-256-bits-long}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
    allowed-types: image/jpeg,image/png,image/webp,image/gif
  static:
    base-url: ${STATIC_BASE_URL:https://diegodeaduriz.art}

dda:
  mail:
    enabled: ${DDA_MAIL_ENABLED:false}

# Base values for local/dev so CloudinaryConfig can start.
# For real uploads, set these environment variables locally.
# In prod, the prod profile below requires the real env vars.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:ddadb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
