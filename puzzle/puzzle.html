<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icon-192x192.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego de Aduriz | Puzzle</title>
    <link rel="stylesheet" href="../index copy.css">
    <link rel="stylesheet" href="puzzle.css">
    <link rel="stylesheet" href="../global-close.css">
</head>

<body>

    <div class="close-container">
        <a href="../index.html" class="close-btn">CLOSE</a>
    </div>

    <!-- Global Navbar -->
    <main class="puzzle-container">

        <!-- Selection Screen -->
        <section id="selection-screen" class="visible">
            <h1>Choose an Illustration</h1>
            <p>Select an artwork to start the puzzle.</p>

            <div class="image-grid">
                <!-- Using images found in Ilustrates folder -->
                <div class="puzzle-thumb" data-src="../Ilustrates/dibu1.jpg">
                    <img src="../Ilustrates/dibu1.jpg" alt="Puzzle Option 1">
                </div>
                <div class="puzzle-thumb" data-src="../Ilustrates/b.jpg">
                    <img src="../Ilustrates/b.jpg" alt="Puzzle Option 2">
                </div>
                <div class="puzzle-thumb" data-src="../Ilustrates/cc.jpg">
                    <img src="../Ilustrates/cc.jpg" alt="Puzzle Option 3">
                </div>
                <div class="puzzle-thumb" data-src="../Ilustrates/dibu5.jpg">
                    <img src="../Ilustrates/dibu5.jpg" alt="Puzzle Option 4">
                </div>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="hidden">
            <div class="game-header">
                <button id="back-btn" class="btn-secondary">← Back</button>
                <div class="timer">Time: <span id="time-display">00:00</span></div>
                <button id="restart-btn" class="btn-primary">Shuffle</button>
            </div>

            <div class="game-area">
                <div id="puzzle-board"></div>
                <div id="reference-image">
                    <p>Reference</p>
                    <img id="ref-img" src="" alt="Reference">
                </div>
            </div>
        </section>

        <!-- Win Modal -->
        <div id="win-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Puzzle Solved!</h2>
                <p>Time: <span id="final-time"></span></p>
                <button id="play-again-btn" class="btn-primary">Play Again</button>
            </div>
        </div>

    </main>

    <script src="puzzle.js"></script>
</body>

</html>
