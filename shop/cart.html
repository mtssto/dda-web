<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icon-192x192.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego De Aduriz | Carrito</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="cart.css">
</head>

<body>
    <div class="cart-wrapper">
        <div class="cart-container">
            <div class="cart-header">
                <a href="shop.html" class="cart-back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Volver a la tienda
                </a>
                <h1 class="cart-title">Tu Selección</h1>
                <p class="cart-subtitle" id="cartSubtitle">0 obras seleccionadas</p>
            </div>

            <!-- Cart Items -->
            <div class="cart-items" id="cartItems">
                <!-- Items rendered by JS -->
            </div>

            <!-- Empty State -->
            <div class="cart-empty" id="cartEmpty" hidden>
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <h3>Tu selección está vacía</h3>
                <p>Explorá el catálogo y agregá las obras que te interesen.</p>
                <a href="shop.html" class="cart-browse-btn">Ver catálogo</a>
            </div>

            <!-- Cart Actions -->
            <div class="cart-actions" id="cartActions" hidden>
                <button class="cart-clear-btn" id="cartClearBtn">Vaciar selección</button>
                <div class="cart-summary">
                    <p class="cart-total-label"><span id="cartTotalCount">0</span> obras seleccionadas</p>
                </div>
                <div class="cart-checkout-btns">
                    <a class="cart-checkout-btn primary" id="cartWhatsApp" href="#" target="_blank" rel="noopener noreferrer">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                        </svg>
                        Consultar por WhatsApp
                    </a>
                    <a class="cart-checkout-btn" id="cartEmail" href="#">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        Enviar consulta por email
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
    <script>
        (function () {
            'use strict';

            var WHATSAPP_NUMBER = '5491160139563';
            var CONTACT_EMAIL = 'dondiegodeaduriz@gmail.com';

            function renderCart() {
                var cart = DDACart.getCart();
                var itemsContainer = document.getElementById('cartItems');
                var emptyState = document.getElementById('cartEmpty');
                var actionsSection = document.getElementById('cartActions');
                var subtitle = document.getElementById('cartSubtitle');
                var totalCount = document.getElementById('cartTotalCount');

                if (cart.length === 0) {
                    itemsContainer.innerHTML = '';
                    emptyState.hidden = false;
                    actionsSection.hidden = true;
                    subtitle.textContent = 'Tu selección está vacía';
                    return;
                }

                emptyState.hidden = true;
                actionsSection.hidden = false;
                subtitle.textContent = cart.length + (cart.length === 1 ? ' obra seleccionada' : ' obras seleccionadas');
                totalCount.textContent = cart.length;

                itemsContainer.innerHTML = cart.map(function (item) {
                    var imgSrc = item.image || '/portfolio/sections/obras/MG_1192.jpg';
                    return '<div class="cart-item" data-id="' + item.id + '">' +
                        '<div class="cart-item-image">' +
                            '<img src="' + imgSrc + '" alt="' + item.title + '" loading="lazy" onerror="this.src=\'/portfolio/sections/obras/MG_1192.jpg\'">' +
                        '</div>' +
                        '<div class="cart-item-info">' +
                            '<h3 class="cart-item-title">' + item.title + '</h3>' +
                            '<p class="cart-item-meta">' +
                                (item.technique ? item.technique : '') +
                                (item.dimensions ? (item.technique ? ' · ' : '') + item.dimensions : '') +
                                (item.year && item.year !== 'Consultar año' && item.year !== 'a confirmar' ? ' · ' + item.year : '') +
                            '</p>' +
                            '<p class="cart-item-price">' + item.price + '</p>' +
                        '</div>' +
                        '<button class="cart-item-remove" aria-label="Quitar ' + item.title + '" data-id="' + item.id + '">' +
                            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                                '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' +
                            '</svg>' +
                        '</button>' +
                    '</div>';
                }).join('');

                // Update checkout links
                var waMsg = encodeURIComponent(DDACart.generateWhatsAppMessage());
                document.getElementById('cartWhatsApp').href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + waMsg;

                var emSubject = encodeURIComponent('Consulta sobre ' + cart.length + ' obras');
                var emBody = encodeURIComponent(DDACart.generateEmailBody());
                document.getElementById('cartEmail').href = 'mailto:' + CONTACT_EMAIL + '?subject=' + emSubject + '&body=' + emBody;
            }

            // Remove item handler
            document.getElementById('cartItems').addEventListener('click', function (e) {
                var removeBtn = e.target.closest('.cart-item-remove');
                if (!removeBtn) return;
                var id = removeBtn.getAttribute('data-id');
                DDACart.removeItem(id);
                renderCart();
            });

            // Clear cart
            document.getElementById('cartClearBtn').addEventListener('click', function () {
                if (confirm('¿Vaciar toda la selección?')) {
                    DDACart.clearCart();
                    renderCart();
                }
            });

            renderCart();
        })();
    </script>
</body>

</html>
