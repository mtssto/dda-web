<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icon-192x192.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Diego De Aduriz | Mi Cuenta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mi-cuenta.css">
</head>

<body>
    <!-- Top Bar -->
    <header class="account-topbar">
        <div class="topbar-left">
            <a href="shop.html" class="topbar-back">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
                </svg>
                Volver a la tienda
            </a>
        </div>
        <div class="topbar-right">
            <span class="topbar-user" id="accountUsername"></span>
            <button class="topbar-logout" id="logoutBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Cerrar Sesión
            </button>
        </div>
    </header>

    <main class="account-main">
        <h1 class="account-title">Mi Cuenta</h1>

        <!-- Tab Navigation -->
        <div class="account-tabs">
            <button class="account-tab active" data-tab="profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                Perfil
            </button>
            <button class="account-tab" data-tab="wishlist">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                Favoritos
                <span class="tab-count" id="wishlistCount">0</span>
            </button>
            <button class="account-tab" data-tab="recent">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                Vistos Recientemente
            </button>
        </div>

        <!-- Profile Tab -->
        <section class="tab-content active" id="tab-profile">
            <div class="profile-card">
                <div class="profile-avatar" id="profileAvatar">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="profile-info">
                    <h2 class="profile-name" id="profileName"></h2>
                    <p class="profile-role" id="profileRole"></p>
                </div>
            </div>

            <div class="profile-details">
                <div class="detail-row">
                    <span class="detail-label">Usuario</span>
                    <span class="detail-value" id="detailUsername"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Rol</span>
                    <span class="detail-value" id="detailRole"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Obras en Favoritos</span>
                    <span class="detail-value" id="detailWishlistCount">0</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Vistas Recientes</span>
                    <span class="detail-value" id="detailRecentCount">0</span>
                </div>
            </div>

            <div class="profile-actions" id="adminLink" hidden>
                <a href="admin.html" class="btn-profile-action">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    Ir al Panel de Administración
                </a>
            </div>
        </section>

        <!-- Wishlist Tab -->
        <section class="tab-content" id="tab-wishlist">
            <div class="wishlist-grid" id="wishlistGrid">
                <p class="empty-state" id="wishlistEmpty">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    No tenés obras en favoritos todavía.<br>
                    <a href="catalog.html">Explorá el catálogo</a> y hacé click en el corazón para guardar obras.
                </p>
            </div>
        </section>

        <!-- Recently Viewed Tab -->
        <section class="tab-content" id="tab-recent">
            <div class="wishlist-grid" id="recentGrid">
                <p class="empty-state" id="recentEmpty">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    No visitaste ninguna obra todavía.<br>
                    <a href="catalog.html">Explorá el catálogo</a> para comenzar.
                </p>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="auth.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            // ── Auth check ───────────────────────────
            if (!DDAAuth.isAuthenticated()) {
                window.location.href = 'user-login.html';
                return;
            }

            var user = DDAAuth.getUser();

            // ── Populate profile ─────────────────────
            document.getElementById('accountUsername').textContent = user ? user.username : '';
            document.getElementById('profileName').textContent = user ? user.username : '';
            document.getElementById('profileRole').textContent = user && user.role === 'ADMIN' ? 'Administrador' : 'Usuario';
            document.getElementById('profileAvatar').textContent = user ? user.username.charAt(0).toUpperCase() : '?';
            document.getElementById('detailUsername').textContent = user ? user.username : '';
            document.getElementById('detailRole').textContent = user && user.role === 'ADMIN' ? 'Administrador' : 'Usuario';

            if (user && user.role === 'ADMIN') {
                document.getElementById('adminLink').hidden = false;
            }

            document.getElementById('logoutBtn').addEventListener('click', function () {
                DDAAuth.logout();
            });

            document.querySelectorAll('.account-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    document.querySelectorAll('.account-tab').forEach(function (t) { t.classList.remove('active'); });
                    document.querySelectorAll('.tab-content').forEach(function (c) { c.classList.remove('active'); });
                    tab.classList.add('active');
                    document.getElementById('tab-' + tab.getAttribute('data-tab')).classList.add('active');
                });
            });

            var wishlist = readWishlist();
            var recentlyViewed = readRecentlyViewed();
            var wishlistItems = readWishlistItems();

            // First paint: show counts and cached favorite cards immediately.
            updateCounts(wishlist.length, recentlyViewed.length);

            var cachedFavorites = wishlist
                .map(function (id) { return normalizeCachedProduct(wishlistItems[id]); })
                .filter(Boolean);

            renderWishlist(cachedFavorites, wishlist.length > 0 && cachedFavorites.length === 0);
            renderRecentFromCache(recentlyViewed);

            // Background refresh: load backend data to keep favorite metadata current.
            try {
                var products = await fetchAllArtworks();
                var validWishlist = products.length > 0
                    ? wishlist.filter(function (pid) {
                        return products.some(function (p) { return productMatchesWishlistId(p, pid); }) || wishlistItems[pid];
                    })
                    : wishlist;

                if (products.length > 0 && validWishlist.length !== wishlist.length) {
                    wishlist = validWishlist;
                    saveWishlist(validWishlist);
                }

                var refreshedFavorites = validWishlist.map(function (pid) {
                    return products.find(function (p) { return productMatchesWishlistId(p, pid); }) || normalizeCachedProduct(wishlistItems[pid]);
                }).filter(Boolean);

                updateWishlistItemCache(refreshedFavorites, validWishlist);
                updateCounts(validWishlist.length, recentlyViewed.length);
                renderWishlist(refreshedFavorites, false);
                renderRecentFromBackend(recentlyViewed, products);
            } catch (error) {
                console.error('Could not refresh artworks for account page:', error);
            }

            async function fetchAllArtworks() {
                var apiBase = getApiBaseUrl();
                var page = 0;
                var size = 100;
                var all = [];
                var hasMore = true;

                while (hasMore) {
                    var response = await fetch(apiBase + '/artworks?page=' + page + '&size=' + size + '&sort=id,desc', {
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!response.ok) {
                        throw new Error('Could not load artworks. Status: ' + response.status);
                    }

                    var result = await response.json();
                    var content = Array.isArray(result.content) ? result.content : [];
                    all = all.concat(content);
                    hasMore = result.last === false && content.length > 0;
                    page++;
                }

                return all;
            }

            function getApiBaseUrl() {
                if (window.DDA_API_BASE) return normalizeApiBase(window.DDA_API_BASE);
                if (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL) return normalizeApiBase(window.APP_CONFIG.API_BASE_URL);
                if (window.API_BASE_URL) return normalizeApiBase(window.API_BASE_URL);
                return '/api';
            }

            function normalizeApiBase(value) {
                var clean = String(value || '').replace(/\/$/, '');
                if (!clean) return '/api';
                return clean.endsWith('/api') ? clean : clean + '/api';
            }

            function getProductId(product) {
                return getProductKeys(product)[0] || '';
            }

            function getProductKeys(product) {
                if (!product) return [];
                var keys = [];
                [product.id, product.backendId, product.slug, product.title].forEach(function (value) {
                    if (value !== null && value !== undefined && String(value).trim()) {
                        var key = String(value).trim();
                        if (keys.indexOf(key) === -1) keys.push(key);
                    }
                });
                return keys;
            }

            function productMatchesWishlistId(product, wishlistId) {
                return getProductKeys(product).indexOf(String(wishlistId)) !== -1;
            }

            function readWishlist() {
                try {
                    var parsed = JSON.parse(localStorage.getItem('dda_wishlist') || '[]');
                    return Array.isArray(parsed) ? parsed.map(String) : [];
                } catch (error) {
                    console.warn('Could not read wishlist:', error);
                    return [];
                }
            }

            function saveWishlist(wishlist) {
                var normalized = [];
                (wishlist || []).forEach(function (item) {
                    var value = String(item || '').trim();
                    if (value && normalized.indexOf(value) === -1) normalized.push(value);
                });
                localStorage.setItem('dda_wishlist', JSON.stringify(normalized));
            }

            function readWishlistItems() {
                try {
                    var parsed = JSON.parse(localStorage.getItem('dda_wishlist_items') || '{}');
                    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
                } catch (error) {
                    console.warn('Could not read wishlist item cache:', error);
                    return {};
                }
            }

            function saveWishlistItems(items) {
                localStorage.setItem('dda_wishlist_items', JSON.stringify(items || {}));
            }

            function readRecentlyViewed() {
                try {
                    var parsed = JSON.parse(localStorage.getItem('dda_recently_viewed') || '[]');
                    return Array.isArray(parsed) ? parsed : [];
                } catch (error) {
                    console.warn('Could not read recently viewed:', error);
                    return [];
                }
            }

            function updateCounts(wishlistCount, recentCount) {
                document.getElementById('wishlistCount').textContent = wishlistCount;
                document.getElementById('detailWishlistCount').textContent = wishlistCount;
                document.getElementById('detailRecentCount').textContent = recentCount;
            }

            function renderWishlist(products, showLoadingFallback) {
                var grid = document.getElementById('wishlistGrid');
                var empty = document.getElementById('wishlistEmpty');
                clearCards(grid);

                if (products.length > 0) {
                    empty.hidden = true;
                    products.forEach(function (product) {
                        grid.appendChild(createProductCard(product, 'wishlist'));
                    });
                    return;
                }

                empty.hidden = false;
                if (showLoadingFallback) {
                    empty.innerHTML = 'Cargando tus favoritos...';
                }
            }

            function renderRecentFromCache(recentlyViewed) {
                var cached = recentlyViewed
                    .map(function (item) { return typeof item === 'string' ? { id: item } : item; })
                    .filter(function (item) { return item && (item.title || item.image); });

                if (cached.length > 0) {
                    renderRecentProducts(cached);
                }
            }

            function renderRecentFromBackend(recentlyViewed, products) {
                var resolved = recentlyViewed.map(function (item) {
                    var id = typeof item === 'string' ? item : item.id;
                    return products.find(function (p) { return productMatchesWishlistId(p, id); }) || (typeof item === 'object' ? item : null);
                }).filter(Boolean);

                renderRecentProducts(resolved);
            }

            function renderRecentProducts(products) {
                var recentGrid = document.getElementById('recentGrid');
                var empty = document.getElementById('recentEmpty');
                clearCards(recentGrid);

                if (products.length > 0) {
                    empty.hidden = true;
                    products.forEach(function (product) {
                        recentGrid.appendChild(createProductCard(product, 'recent'));
                    });
                }
            }

            function clearCards(grid) {
                Array.from(grid.querySelectorAll('.account-card')).forEach(function (card) {
                    card.remove();
                });
            }

            function updateWishlistItemCache(products, wishlistIds) {
                var cache = readWishlistItems();

                products.forEach(function (product, index) {
                    var id = wishlistIds[index] || getProductId(product);
                    if (!id) return;
                    cache[id] = getProductSnapshot(product, id);
                });

                saveWishlistItems(cache);
            }

            function getProductSnapshot(product, fallbackId) {
                return {
                    id: String(fallbackId || getProductId(product)),
                    backendId: product.id || product.backendId || null,
                    slug: product.slug || '',
                    title: product.title || 'Obra sin título',
                    image: getPrimaryImageUrl(product),
                    images: Array.isArray(product.images) ? product.images : (getPrimaryImageUrl(product) ? [getPrimaryImageUrl(product)] : []),
                    price: product.price || 'Consultar',
                    technique: product.technique || '',
                    dimensions: product.dimensions || '',
                    year: product.year || '',
                    category: product.category || '',
                    sold: product.sold === true,
                    cachedAt: new Date().toISOString()
                };
            }

            function normalizeCachedProduct(product) {
                if (!product) return null;
                return {
                    id: product.id || product.backendId || product.slug || product.title || '',
                    backendId: product.backendId || null,
                    slug: product.slug || '',
                    title: product.title || 'Obra sin título',
                    image: product.image || '',
                    images: Array.isArray(product.images) ? product.images : (product.image ? [product.image] : []),
                    price: product.price || 'Consultar',
                    technique: product.technique || '',
                    dimensions: product.dimensions || '',
                    year: product.year || '',
                    category: product.category || '',
                    sold: product.sold === true
                };
            }

            function getPrimaryImageUrl(product) {
                var images = Array.isArray(product.images) ? product.images : [];
                var primaryImage = images.find(function (img) { return img && (img.isPrimary || img.primary); }) || images[0];

                return normalizeImageUrl(
                    product.image ||
                    product.imageUrl ||
                    primaryImage ||
                    ''
                );
            }

            function normalizeImageUrl(image) {
                var rawPath = typeof image === 'string'
                    ? image
                    : image && (image.filePath || image.url || image.imageUrl || '');

                if (!rawPath) return '';

                var path = String(rawPath).trim();
                if (!path) return '';

                if (path.startsWith('http://') || path.startsWith('https://')) {
                    return path;
                }

                if (path.startsWith('/uploads/') || path.startsWith('uploads/')) {
                    return joinUrl(getApiBaseUrl().replace(/\/api$/, ''), path);
                }

                if (!path.includes('/') && /\.(png|jpe?g|webp|gif|avif|svg)$/i.test(path)) {
                    return joinUrl(getStaticBaseUrl(), '/portfolio/sections/obras/' + path);
                }

                return new URL(path, getStaticBaseUrl() + '/shop/mi-cuenta.html').href;
            }

            function getStaticBaseUrl() {
                return (window.DDA_STATIC_BASE || window.location.origin).replace(/\/$/, '');
            }

            function joinUrl(base, path) {
                return String(base || '').replace(/\/$/, '') + '/' + String(path || '').replace(/^\/+/g, '');
            }

            function createProductCard(product, type) {
                var card = document.createElement('div');
                card.className = 'account-card';

                var productId = getProductId(product);
                var imgSrc = getPrimaryImageUrl(product);
                var webpSrc = imgSrc.replace(/\.(jpe?g|png)$/i, '.webp');

                card.innerHTML =
                    '<div class="account-card-img">' +
                        '<picture>' +
                            '<source srcset="' + escapeAttribute(webpSrc) + '" type="image/webp">' +
                            '<img src="' + escapeAttribute(imgSrc) + '" alt="' + escapeAttribute(product.title) + '" loading="lazy">' +
                        '</picture>' +
                    '</div>' +
                    '<div class="account-card-info">' +
                        '<h3>' + escapeHtml(product.title) + '</h3>' +
                        (product.technique ? '<p class="card-meta">' + escapeHtml(product.technique) + '</p>' : '') +
                        (product.dimensions ? '<p class="card-meta">' + escapeHtml(product.dimensions) + '</p>' : '') +
                        '<p class="card-price">' + escapeHtml(product.price || 'Consultar') + '</p>' +
                    '</div>' +
                    (type === 'wishlist' ?
                        '<button class="remove-btn" data-id="' + escapeAttribute(productId) + '" title="Quitar de favoritos">' +
                            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                            '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                        '</button>'
                        : '');

                var removeBtn = card.querySelector('.remove-btn');
                if (removeBtn) {
                    removeBtn.addEventListener('click', function () {
                        var wl = readWishlist();
                        var cache = readWishlistItems();
                        var idx = wl.indexOf(productId);
                        if (idx !== -1) wl.splice(idx, 1);
                        delete cache[productId];
                        saveWishlist(wl);
                        saveWishlistItems(cache);
                        card.remove();
                        updateCounts(wl.length, readRecentlyViewed().length);
                        if (wl.length === 0) document.getElementById('wishlistEmpty').hidden = false;
                    });
                }

                card.addEventListener('click', function (e) {
                    if (e.target.closest('.remove-btn')) return;
                    window.location.href = 'catalog.html';
                });

                return card;
            }

            function escapeHtml(str) {
                if (str === null || str === undefined) return '';
                var div = document.createElement('div');
                div.textContent = String(str);
                return div.innerHTML;
            }

            function escapeAttribute(str) {
                return escapeHtml(str).replace(/"/g, '&quot;');
            }
        });
    </script>
</body>

</html>
