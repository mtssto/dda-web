<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icon-192x192.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego De Aduriz | Mi Cuenta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <button class="login-close-btn" id="loginCloseBtn" aria-label="Cerrar" title="Cerrar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="login-header">
                <h1 class="login-title">Diego De Aduriz</h1>
                <p class="login-subtitle">Mi Cuenta</p>
            </div>

            <!-- Tab switcher -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Iniciar Sesión</button>
                <button class="auth-tab" id="tabRegister">Crear Cuenta</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="loginUsername">Usuario</label>
                    <input type="text" id="loginUsername" name="username" autocomplete="username" required
                        placeholder="Ingresá tu usuario">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required
                            placeholder="Ingresá tu contraseña">
                        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="loginError" class="login-error" role="alert" hidden>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <span id="loginErrorText"></span>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="btn-loader" hidden>
                        <svg width="20" height="20" viewBox="0 0 24 24" class="spinner">
                            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-linecap="round"/>
                        </svg>
                    </span>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="login-form" hidden novalidate>
                <div class="form-group">
                    <label for="regUsername">Usuario</label>
                    <input type="text" id="regUsername" name="username" autocomplete="username" required
                        placeholder="Elegí un nombre de usuario" minlength="3" maxlength="50">
                    <span class="field-hint" id="regUsernameHint"></span>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" name="email" autocomplete="email" required
                        placeholder="tu@email.com">
                    <span class="field-hint" id="regEmailHint"></span>
                </div>

                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" name="password" autocomplete="new-password" required
                            placeholder="Mínimo 8 caracteres" minlength="8">
                        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Password strength indicator -->
                <div class="password-requirements" id="passwordRequirements">
                    <p class="req-title">La contraseña debe tener:</p>
                    <ul class="req-list">
                        <li id="reqLength"><span class="req-icon">○</span> Al menos 8 caracteres</li>
                        <li id="reqUpper"><span class="req-icon">○</span> Una letra mayúscula</li>
                        <li id="reqLower"><span class="req-icon">○</span> Una letra minúscula</li>
                        <li id="reqNumber"><span class="req-icon">○</span> Un número</li>
                        <li id="reqSpecial"><span class="req-icon">○</span> Un carácter especial (!@#$...)</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="regPasswordConfirm">Confirmar Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPasswordConfirm" name="password_confirm" autocomplete="new-password" required
                            placeholder="Repetí tu contraseña">
                        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="registerError" class="login-error" role="alert" hidden>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <span id="registerErrorText"></span>
                </div>

                <div id="registerSuccess" class="login-success" role="status" hidden>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <span id="registerSuccessText">Cuenta creada correctamente</span>
                </div>

                <button type="submit" class="login-btn" id="registerBtn">
                    <span class="btn-text">Crear Cuenta</span>
                    <span class="btn-loader" hidden>
                        <svg width="20" height="20" viewBox="0 0 24 24" class="spinner">
                            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-linecap="round"/>
                        </svg>
                    </span>
                </button>
            </form>

            <div class="login-footer">
                <a href="shop.html" class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Volver a la tienda
                </a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        (function () {
            'use strict';

            // ── DOM refs ─────────────────────────────────
            var tabLogin = document.getElementById('tabLogin');
            var tabRegister = document.getElementById('tabRegister');
            var loginForm = document.getElementById('loginForm');
            var registerForm = document.getElementById('registerForm');
            var closeBtn = document.getElementById('loginCloseBtn');
            var submitting = false;

            // ── Close button ─────────────────────────────
            closeBtn.addEventListener('click', function () {
                window.location.href = 'shop.html';
            });

            // ── Tab switching ────────────────────────────
            tabLogin.addEventListener('click', function () {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                loginForm.hidden = false;
                registerForm.hidden = true;
            });

            tabRegister.addEventListener('click', function () {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                registerForm.hidden = false;
                loginForm.hidden = true;
            });

            // ── Toggle password visibility ───────────────
            document.querySelectorAll('.toggle-password').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var input = this.previousElementSibling;
                    var isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    this.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
                });
            });

            // ── Redirect if already logged in ────────────
            if (DDAAuth.isAuthenticated()) {
                window.location.href = 'mi-cuenta.html';
            }

            // ── Auto-switch to register tab if #register hash ──
            if (window.location.hash === '#register') {
                tabRegister.click();
            }

            // ── Keyboard: Escape closes ──────────────────
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') window.location.href = 'shop.html';
            });

            // ── Password strength validation ─────────────
            var regPassword = document.getElementById('regPassword');
            var reqLength = document.getElementById('reqLength');
            var reqUpper = document.getElementById('reqUpper');
            var reqLower = document.getElementById('reqLower');
            var reqNumber = document.getElementById('reqNumber');
            var reqSpecial = document.getElementById('reqSpecial');

            function checkPasswordStrength(pw) {
                var rules = {
                    length: pw.length >= 8,
                    upper: /[A-Z]/.test(pw),
                    lower: /[a-z]/.test(pw),
                    number: /[0-9]/.test(pw),
                    special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pw)
                };
                updateReq(reqLength, rules.length);
                updateReq(reqUpper, rules.upper);
                updateReq(reqLower, rules.lower);
                updateReq(reqNumber, rules.number);
                updateReq(reqSpecial, rules.special);
                return rules.length && rules.upper && rules.lower && rules.number && rules.special;
            }

            function updateReq(el, valid) {
                if (valid) {
                    el.classList.add('valid');
                    el.querySelector('.req-icon').textContent = '●';
                } else {
                    el.classList.remove('valid');
                    el.querySelector('.req-icon').textContent = '○';
                }
            }

            var passwordReqBox = document.getElementById('passwordRequirements');
            var passwordHasError = false;

            regPassword.addEventListener('input', function () {
                checkPasswordStrength(this.value);
                if (this.value.length > 0) {
                    passwordReqBox.classList.add('visible');
                }
            });

            regPassword.addEventListener('focus', function () {
                if (this.value.length > 0 || passwordHasError) {
                    passwordReqBox.classList.add('visible');
                }
            });

            regPassword.addEventListener('blur', function () {
                var allValid = checkPasswordStrength(this.value);
                if (this.value.length === 0 || allValid) {
                    passwordReqBox.classList.remove('visible');
                    passwordHasError = false;
                } else {
                    passwordHasError = true;
                }
            });

            // ── Inline validation helpers ────────────────
            function setHint(id, msg, isError) {
                var el = document.getElementById(id);
                if (!el) return;
                el.textContent = msg;
                el.className = 'field-hint' + (isError ? ' hint-error' : ' hint-ok');
            }

            function clearHint(id) {
                var el = document.getElementById(id);
                if (!el) return;
                el.textContent = '';
                el.className = 'field-hint';
            }

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // ── Inline validation on blur ────────────────
            document.getElementById('regUsername').addEventListener('blur', function () {
                var val = this.value.trim();
                if (val && val.length < 3) {
                    setHint('regUsernameHint', 'Mínimo 3 caracteres', true);
                    this.classList.add('input-error');
                } else if (val && val.length > 50) {
                    setHint('regUsernameHint', 'Máximo 50 caracteres', true);
                    this.classList.add('input-error');
                } else {
                    clearHint('regUsernameHint');
                    this.classList.remove('input-error');
                }
            });

            document.getElementById('regEmail').addEventListener('blur', function () {
                var val = this.value.trim();
                if (val && !isValidEmail(val)) {
                    setHint('regEmailHint', 'Formato de email inválido', true);
                    this.classList.add('input-error');
                } else {
                    clearHint('regEmailHint');
                    this.classList.remove('input-error');
                }
            });

            // ── Login submit ─────────────────────────────
            loginForm.addEventListener('submit', function (e) {
                e.preventDefault();
                if (submitting) return;
                var errorBox = document.getElementById('loginError');
                var errorText = document.getElementById('loginErrorText');
                var btn = document.getElementById('loginBtn');
                var btnText = btn.querySelector('.btn-text');
                var btnLoader = btn.querySelector('.btn-loader');
                errorBox.hidden = true;

                var username = document.getElementById('loginUsername').value.trim();
                var password = document.getElementById('loginPassword').value;

                if (!username || !password) {
                    errorText.textContent = 'Completá todos los campos';
                    errorBox.hidden = false;
                    return;
                }

                submitting = true;
                btnText.hidden = true;
                btnLoader.hidden = false;
                btn.disabled = true;

                DDAAuth.login(username, password)
                    .then(function () {
                        window.location.href = 'mi-cuenta.html';
                    })
                    .catch(function (err) {
                        errorText.textContent = err.message || 'Usuario o contraseña incorrectos';
                        errorBox.hidden = false;
                        btnText.hidden = false;
                        btnLoader.hidden = true;
                        btn.disabled = false;
                        submitting = false;
                    });
            });

            // ── Register submit ──────────────────────────
            registerForm.addEventListener('submit', function (e) {
                e.preventDefault();
                if (submitting) return;
                var errorBox = document.getElementById('registerError');
                var errorText = document.getElementById('registerErrorText');
                var successBox = document.getElementById('registerSuccess');
                var btn = document.getElementById('registerBtn');
                var btnText = btn.querySelector('.btn-text');
                var btnLoader = btn.querySelector('.btn-loader');
                errorBox.hidden = true;
                successBox.hidden = true;

                var username = document.getElementById('regUsername').value.trim();
                var email = document.getElementById('regEmail').value.trim();
                var password = document.getElementById('regPassword').value;
                var passwordConfirm = document.getElementById('regPasswordConfirm').value;

                if (!username || !email || !password || !passwordConfirm) {
                    errorText.textContent = 'Completá todos los campos';
                    errorBox.hidden = false;
                    return;
                }

                if (username.length < 3 || username.length > 50) {
                    errorText.textContent = 'El usuario debe tener entre 3 y 50 caracteres';
                    errorBox.hidden = false;
                    return;
                }

                if (!isValidEmail(email)) {
                    errorText.textContent = 'Ingresá un email válido';
                    errorBox.hidden = false;
                    return;
                }

                if (!checkPasswordStrength(password)) {
                    errorText.textContent = 'La contraseña no cumple los requisitos de seguridad';
                    errorBox.hidden = false;
                    return;
                }

                if (password !== passwordConfirm) {
                    errorText.textContent = 'Las contraseñas no coinciden';
                    errorBox.hidden = false;
                    return;
                }

                submitting = true;
                btnText.hidden = true;
                btnLoader.hidden = false;
                btn.disabled = true;

                DDAAuth.register(username, email, password)
                    .then(function () {
                        successBox.hidden = false;
                        setTimeout(function () {
                            window.location.href = 'mi-cuenta.html';
                        }, 1000);
                    })
                    .catch(function (err) {
                        var msg = err.message || 'Error al crear la cuenta';
                        if (err.errors) {
                            var msgs = [];
                            for (var field in err.errors) {
                                msgs.push(err.errors[field]);
                            }
                            msg = msgs.join('. ');
                        }
                        errorText.textContent = msg;
                        errorBox.hidden = false;
                        btnText.hidden = false;
                        btnLoader.hidden = true;
                        btn.disabled = false;
                        submitting = false;
                    });
            });
        })();
    </script>
</body>

</html>
