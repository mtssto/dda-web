<!-- Featured Shop Carousel -->
<section class="featured-carousel-section">
    <h2 class="featured-title">Destacados</h2>
    <div class="carousel-container">
        <button class="carousel-btn prev-btn" aria-label="Previous">❮</button>
        <div class="carousel-track">
            <!-- Carousel Item 1 -->
            <div class="product-card carousel-card" data-category="pasteles" data-dimensions="140 x 125 cm"
                data-technique="Aerosol y pastel sobre madera" onclick="openModal(this)">
                <div class="product-image">
                    <img src="../portfolio/sections/obras/MG_0307.png" alt="Paisaje con oso, 2015">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Paisaje con oso</h3>
                    <p class="product-price">$20.00 USD</p>
                    <div class="product-actions-grid">
                        <button class="btn-grid-action btn-grid-details">DETALLES</button>
                        <button class="btn-grid-action btn-grid-buy">COMPRAR</button>
                    </div>
                </div>
            </div>
            <!-- Carousel Item 2 -->
            <div class="product-card carousel-card" data-category="pasteles" data-dimensions="140 x 82 cm"
                data-technique="Aerosol y pastel sobre madera" onclick="openModal(this)">
                <div class="product-image">
                    <img src="../portfolio/sections/obras/MG_0312_1.png" alt="Rayo dorado, 2015">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Rayo dorado</h3>
                    <p class="product-price">$20.00 USD</p>
                    <div class="product-actions-grid">
                        <button class="btn-grid-action btn-grid-details">DETALLES</button>
                        <button class="btn-grid-action btn-grid-buy">COMPRAR</button>
                    </div>
                </div>
            </div>
            <!-- Carousel Item 3 -->
            <div class="product-card carousel-card" data-category="pasteles" data-dimensions="33 x 25 cm"
                data-technique="Pastel tiza sobre papel" onclick="openModal(this)">
                <div class="product-image">
                    <img src="../portfolio/sections/obras/MG_0327.jpg.png" alt="Yukito">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Yukito</h3>
                    <p class="product-price">$20.00 USD</p>
                    <div class="product-actions-grid">
                        <button class="btn-grid-action btn-grid-details">DETALLES</button>
                        <button class="btn-grid-action btn-grid-buy">COMPRAR</button>
                    </div>
                </div>
            </div>
            <!-- Carousel Item 4 -->
            <div class="product-card carousel-card" data-category="pasteles" data-dimensions="205 x 210 cm"
                data-technique="Pastel sobre tela" onclick="openModal(this)">
                <div class="product-image">
                    <img src="../portfolio/sections/obras/MG_1192.jpg" alt="Gato Merlín">
                </div>
                <div class="product-info">
                    <h3 class="product-title">Gato Merlín</h3>
                    <p class="product-price">$20.00 USD</p>
                    <div class="product-actions-grid">
                        <button class="btn-grid-action btn-grid-details">DETALLES</button>
                        <button class="btn-grid-action btn-grid-buy">COMPRAR</button>
                    </div>
                </div>
            </div>
        </div>
        <button class="carousel-btn next-btn" aria-label="Next">❯</button>
    </div>
</section>
