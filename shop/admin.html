<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icon-192x192.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Diego De Aduriz | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <!-- Top Bar -->
    <header class="admin-topbar">
        <div class="topbar-left">
            <h1 class="topbar-title">DDA Admin</h1>
        </div>
        <div class="topbar-right">
            <span class="topbar-user" id="adminUsername"></span>
            <button class="topbar-logout" id="logoutBtn" aria-label="Cerrar sesión">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Salir
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Stats Bar -->
        <div class="admin-stats" id="adminStats">
            <div class="stat-card">
                <span class="stat-value" id="statTotal">-</span>
                <span class="stat-label">Total Obras</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statAvailable">-</span>
                <span class="stat-label">Disponibles</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statSold">-</span>
                <span class="stat-label">Vendidas</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statCategories">-</span>
                <span class="stat-label">Categorías</span>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="admin-toolbar">
            <div class="toolbar-left">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="adminSearch" placeholder="Buscar obras...">
                </div>
                <select id="adminCategoryFilter" class="toolbar-select">
                    <option value="">Todas las categorías</option>
                </select>
                <select id="adminSoldFilter" class="toolbar-select">
                    <option value="">Disponibilidad</option>
                    <option value="available">Disponibles</option>
                    <option value="sold">Vendidas</option>
                </select>
            </div>
            <div class="toolbar-right">
                <button class="btn-primary" id="addArtworkBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nueva Obra
                </button>
            </div>
        </div>

        <!-- Artwork Table -->
        <div class="admin-table-wrap">
            <table class="admin-table" id="artworkTable">
                <thead>
                    <tr>
                        <th class="col-img">Imagen</th>
                        <th class="col-title">Título</th>
                        <th class="col-cat">Categoría</th>
                        <th class="col-tech">Técnica</th>
                        <th class="col-dim">Dimensiones</th>
                        <th class="col-price">Precio</th>
                        <th class="col-status">Estado</th>
                        <th class="col-actions">Acciones</th>
                    </tr>
                </thead>
                <tbody id="artworkTableBody">
                    <tr class="table-loading">
                        <td colspan="8">Cargando obras...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="admin-pagination" id="adminPagination"></div>
    </main>

    <!-- Artwork Modal (Create / Edit) -->
    <div class="modal-overlay" id="artworkModal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Nueva Obra</h2>
                <button class="modal-close" id="modalClose" aria-label="Cerrar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="artworkForm" novalidate>
                <input type="hidden" id="artworkId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="artTitle">Título *</label>
                        <input type="text" id="artTitle" required maxlength="200">
                    </div>
                    <div class="form-group">
                        <label for="artCategory">Categoría</label>
                        <select id="artCategory" class="form-select"></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="artTechnique">Técnica</label>
                        <input type="text" id="artTechnique" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="artDimensions">Dimensiones</label>
                        <input type="text" id="artDimensions" maxlength="50" placeholder="ej: 50 x 70 cm">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="artPrice">Precio</label>
                        <input type="text" id="artPrice" maxlength="50" placeholder="ej: USD 500">
                    </div>
                    <div class="form-group">
                        <label for="artYear">Año</label>
                        <input type="text" id="artYear" maxlength="20" placeholder="ej: 2024">
                    </div>
                </div>
                <div class="form-group">
                    <label for="artDescription">Descripción</label>
                    <textarea id="artDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="artSold">
                        Vendida
                    </label>
                </div>
                <div id="formError" class="form-error" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>
                    <button type="submit" class="btn-primary" id="modalSave">
                        <span class="btn-text">Guardar</span>
                        <span class="btn-loader" hidden>
                            <svg width="16" height="16" viewBox="0 0 24 24" class="spinner">
                                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation -->
    <div class="modal-overlay" id="deleteModal" hidden>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2 class="modal-title">Eliminar obra</h2>
                <button class="modal-close" id="deleteModalClose" aria-label="Cerrar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <p class="delete-text">¿Estás seguro de que querés eliminar <strong id="deleteArtworkName"></strong>?</p>
            <p class="delete-subtext">Esta acción no se puede deshacer.</p>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="deleteCancelBtn">Cancelar</button>
                <button type="button" class="btn-danger" id="deleteConfirmBtn">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="admin-app.js"></script>
</body>

</html>
